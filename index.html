<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cookies ID Panel | Strict White</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ওস্তাদ, এখানে কালারগুলো একদম লক করে দেওয়া হলো যেন টেলিগ্রাম থিম একে চেঞ্জ না করতে পারে */
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: #ffffff !important; /* ফোর্স হোয়াইট */
            color: #000000 !important; /* ফোর্স ব্ল্যাক টেক্সট */
            margin: 0; 
            padding: 5px; 
            box-sizing: border-box;
        }

        .header { 
            background: linear-gradient(135deg, #FF2D55 0%, #D81B60 100%) !important;
            color: #ffffff !important; 
            padding: 10px; 
            border-radius: 6px; 
            text-align: center; 
            margin-bottom: 5px; 
            font-size: 15px; 
            font-weight: bold; 
            letter-spacing: 0.5px;
        }
        
        .notice-box { 
            background: #ffebee !important; 
            border: 1px dashed #d32f2f !important; 
            color: #d32f2f !important; 
            padding: 10px; 
            border-radius: 6px; 
            text-align: center; 
            margin-bottom: 8px; 
            font-size: 12px; 
            font-weight: bold;
            line-height: 1.5;
        }

        .paste-box { 
            width: 100%; 
            height: 50px; 
            border: 1px solid #FF2D55 !important; 
            border-radius: 5px; 
            padding: 6px; 
            box-sizing: border-box; 
            margin-bottom: 5px; 
            background: #ffffff !important; 
            color: #000000 !important; 
            font-size: 12px; 
            outline: none; 
        }
        
        .container { 
            background: #ffffff !important; 
            border-radius: 5px; 
            overflow: auto; 
            max-height: 55vh; 
            border: 1px solid #cccccc !important;
        }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; background: #ffffff !important;}
        th { 
            background: #e4e6eb !important; 
            padding: 6px; 
            border: 1px solid #cccccc !important; 
            font-size: 11px; 
            color: #000000 !important;
            font-weight: bold;
        }
        td { border: 1px solid #cccccc !important; padding: 0; background: #ffffff !important; }
        
        input { 
            width: 100%; 
            border: none !important; 
            padding: 8px 2px; 
            box-sizing: border-box; 
            outline: none; 
            font-size: 11px; 
            text-align: center; 
            background: #ffffff !important; 
            color: #000000 !important; /* লেখা কুচকুচে কালো হবে */
        }
        input:focus { background: rgba(255, 45, 85, 0.05) !important; }

        .footer-btns { 
            margin-top: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
        }
        .btn { 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            padding: 12px; 
            font-size: 14px; 
        }
        
        .btn-add { 
            background: #e4e6eb !important; 
            color: #050505 !important; 
        }
        
        .btn-submit { 
            background: #00C853 !important; /* ফ্রেশ গ্রিন বাটন */
            color: #ffffff !important; 
        }
        
        #custom-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(255, 255, 255, 0.98) !important; /* লোডার স্ক্রিনও ধবধবে সাদা */
            z-index: 10000; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        .loader-content { text-align: center; color: #333333 !important; padding: 0 20px; }
        .neon-spinner {
            width: 50px; height: 50px; 
            border: 4px solid rgba(255, 45, 85, 0.1) !important; 
            border-top: 4px solid #FF2D55 !important; 
            border-radius: 50%; 
            margin: 0 auto 20px auto; 
            animation: spin 1s linear infinite; 
        }
        .neon-spinner.success { 
            border: 4px solid #00C853 !important; 
            animation: pulse 0.5s ease-in-out forwards; 
        }
        #loader-text { font-size: 14px; font-weight: bold; margin: 0; color: #333333 !important; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="custom-overlay">
    <div class="loader-content">
        <div class="neon-spinner"></div>
        <p id="loader-text">⏳ সার্ভারে ডাটা পাঠানো হচ্ছে...<br>অনুগ্রহ করে ১০ সেকেন্ড অপেক্ষা করুন।</p>
    </div>
</div>

<div class="header">COOKIES ID SUBMISSION PANEL</div>

<div class="notice-box">
    ⚠️ কড়া সতর্কবার্তা: ভুল বা ডুপ্লিকেট কুকিজ সাবমিট দিলে আপনার সম্পূর্ণ পেমেন্ট আজীবনের জন্য ক্যান্সেল বা ব্লক করা হবে!
</div>

<textarea class="paste-box" id="paster" placeholder="গুগল শিট থেকে কপি করে এখানে পেস্ট করুন..."></textarea>

<div class="container">
    <table>
        <thead>
            <tr>
                <th style="width:15%">SL</th>
                <th>UID</th>
                <th>Pass</th>
                <th>Cookies</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
</div>

<div class="footer-btns">
    <button class="btn btn-add" onclick="increaseRows()">➕ Add 20 Rows</button>
    <button class="btn btn-submit" onclick="sendToBot()">SUBMIT ALL COOKIES</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const tbody = document.getElementById('rows');
    let currentRowCount = 0;

    function createRows(count) {
        let fragment = document.createDocumentFragment();
        for(let i=0; i<count; i++) {
            currentRowCount++;
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align:center; background:#f9f9f9 !important; font-size:9px; color:#666 !important; font-weight:bold;">${currentRowCount}</td>
                <td><input class="u"></td>
                <td><input class="p"></td>
                <td><input class="t" placeholder="Cookies দিন"></td>
            `;
            fragment.appendChild(tr);
        }
        tbody.appendChild(fragment);
    }

    createRows(50); 

    function increaseRows() { createRows(20); }

    document.getElementById('paster').addEventListener('input', function(e) {
        let text = e.target.value.trim();
        if(!text) return;

        let lines = text.split(/\r?\n/);
        if (lines.length > currentRowCount) { createRows(lines.length - currentRowCount + 5); }

        let uInputs = document.querySelectorAll('.u');
        let pInputs = document.querySelectorAll('.p');
        let tInputs = document.querySelectorAll('.t');

        lines.forEach((line, index) => {
            let cols = line.split('\t'); 
            if(uInputs[index]) uInputs[index].value = cols[0] || '';
            if(pInputs[index]) pInputs[index].value = cols[1] || '';
            if(tInputs[index]) tInputs[index].value = cols[2] || '';
        });
        setTimeout(() => { e.target.value = ""; }, 800);
    });

    function sendToBot() {
        let us = document.querySelectorAll('.u');
        let ps = document.querySelectorAll('.p');
        let ts = document.querySelectorAll('.t');
        let data = [];

        for(let i=0; i<us.length; i++) {
            if(us[i].value.trim() !== "") {
                data.push({
                    u: us[i].value.trim(), 
                    p: ps[i].value.trim(), 
                    c: ts[i].value.trim(),
                    type: "cookies"
                });
            }
        }

        if(data.length < 10) { 
            if (tg && tg.showAlert) { tg.showAlert("❌ কমপক্ষে ১০ টি আইডি লাগবে! আপনি দিয়েছেন: " + data.length); } 
            else { alert("❌ কমপক্ষে ১০ টি আইডি লাগবে! আপনি দিয়েছেন: " + data.length); }
            return; 
        }

        document.getElementById('custom-overlay').style.display = "flex";

        if (window.Telegram && window.Telegram.WebApp) {
            setTimeout(function() {
                var spinner = document.querySelector(".neon-spinner");
                if(spinner) spinner.classList.add("success");
                document.getElementById("loader-text").innerHTML = "✅ আপনার সব কুকিজ সাবমিট সম্পন্ন হয়েছে। অনুগ্রহ করে এডমিন রিভিউ পর্যন্ত অপেক্ষা করুন।";
                setTimeout(function() {
                    window.Telegram.WebApp.sendData(JSON.stringify(data));
                    window.Telegram.WebApp.close(); 
                }, 3000);
            }, 10000);
        }
    }
</script>
</body>
</html>
